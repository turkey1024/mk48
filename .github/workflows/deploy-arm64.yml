name: Build and Release ARM64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-release-arm64:
    name: Build & Release Package (ARM64)
    runs-on: ubuntu-latest-8-cores-arm  # 使用 GitHub 的 ARM64 runner

    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 安装 Rust 工具链（ARM64 专用）
      - name: Install Rust Toolchain for ARM64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2022-08-14
          components: rust-src, rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu

      # 3. 安装 Trunk
      - name: Install Trunk
        uses: jetli/trunk-action@v0.1.0
        with:
          version: 'v0.15.0'

      # 4. 编译各个组件
      - name: Build Game Client
        working-directory: ./client
        run: trunk build --release

      - name: Build Server for ARM64
        run: cargo build --release --manifest-path server/Cargo.toml

      # 5. 打包整理
      - name: Package Artifacts
        run: |
          echo ">>> 开始整理 ARM64 版本文件..."
          mkdir -p release_package/public
          
          # === 查找二进制文件 ===
          echo ">>> 正在查找编译生成的 server 文件..."
          
          # 在 target 目录中查找名为 'server' 的可执行文件
          SERVER_PATH=$(find target -name "server" -type f -executable | head -n 1)
          
          # 如果在根目录 target 没找到，尝试在子目录找 (容错)
          if [ -z "$SERVER_PATH" ]; then
             SERVER_PATH=$(find server/target -name "server" -type f -executable 2>/dev/null | head -n 1)
          fi

          if [ -n "$SERVER_PATH" ]; then
            echo "✅ 找到服务端文件: $SERVER_PATH"
            cp "$SERVER_PATH" release_package/mk48-server
            chmod +x release_package/mk48-server
          else
            echo "❌ 错误：无法找到名为 'server' 的可执行文件！"
            echo ">>> 正在列出 target 目录结构帮助排查："
            find target -maxdepth 3 -not -path '*/deps/*'
            exit 1
          fi
          
          # 复制客户端资源
          cp -r client/dist/* release_package/public/
          
          # 压缩，文件名包含 ARM64 架构标志
          PACKAGE_NAME="mk48-linux-aarch64.tar.gz"
          tar -czvf "$PACKAGE_NAME" -C release_package .
          echo ">>> ARM64 打包完成: $PACKAGE_NAME"

      # 6. 发布 Release（如果是 tag 触发）
      - name: Create GitHub Release (ARM64)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mk48-linux-aarch64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. 手动测试上传
      - name: Upload ARM64 Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mk48-arm64-debug-build
          path: mk48-linux-aarch64.tar.gz
          retention-days: 3

      # 8. 推送产物到仓库根目录
      - name: Push ARM64 Artifact to Repository Root
        run: |
          # 配置git用户信息
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 检查是否有文件变更
          if git status --porcelain | grep -q "mk48-linux-aarch64.tar.gz"; then
            # 添加文件到暂存区
            git add mk48-linux-aarch64.tar.gz
            # 提交变更
            git commit -m "chore: upload mk48-linux-aarch64.tar.gz (ARM64) to repo root [skip ci]"
            # 推送到仓库
            git push origin main
            echo "✅ 成功将 mk48-linux-aarch64.tar.gz (ARM64) 推送到仓库根目录"
          else
            echo "ℹ️ mk48-linux-aarch64.tar.gz 无变更，无需推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
