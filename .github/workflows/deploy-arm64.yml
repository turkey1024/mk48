name: Build and Release ARM64 (Fixed)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-release-arm64:
    name: Build & Release Package (ARM64)
    runs-on: ubuntu-22.04-arm  # 使用 ARM64 runner

    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 安装 Rust 工具链
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2022-08-14
          components: rust-src, rustfmt, clippy
          targets: wasm32-unknown-unknown

      # 3. 从源码安装 Trunk（关键修改！）
      - name: Install Trunk from source
        run: |
          echo "正在从源码安装 Trunk (ARM64)..."
          # 安装依赖
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          
          # 安装 trunk
          cargo install trunk --locked
          
          # 验证
          echo "Trunk 版本:"
          trunk --version || echo "Trunk 安装失败"

      # 4. 缓存 Cargo 依赖
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      # 5. 编译客户端
      - name: Build Game Client
        working-directory: ./client
        run: |
          echo "开始编译客户端..."
          trunk build --release
          echo "客户端编译完成"

      # 6. 编译服务器
      - name: Build Server
        run: |
          echo "开始编译服务器..."
          cargo build --release --manifest-path server/Cargo.toml
          echo "服务器编译完成"

      # 7. 打包（与之前相同）
      - name: Package Artifacts
        run: |
          echo ">>> 开始打包 ARM64 版本..."
          mkdir -p release_package/public
          
          # 查找 server 二进制文件
          SERVER_PATH=$(find target -name "server" -type f -executable | head -n 1)
          if [ -z "$SERVER_PATH" ]; then
            SERVER_PATH=$(find server/target -name "server" -type f -executable 2>/dev/null | head -n 1)
          fi

          if [ -n "$SERVER_PATH" ]; then
            echo "✅ 找到服务端文件: $SERVER_PATH"
            cp "$SERVER_PATH" release_package/mk48-server
            chmod +x release_package/mk48-server
          else
            echo "❌ 错误：无法找到 server 可执行文件"
            find target -maxdepth 3 -not -path '*/deps/*'
            exit 1
          fi
          
          # 复制客户端资源
          cp -r client/dist/* release_package/public/
          
          # 打包
          PACKAGE_NAME="mk48-linux-aarch64.tar.gz"
          tar -czvf "$PACKAGE_NAME" -C release_package .
          echo "✅ ARM64 打包完成: $PACKAGE_NAME"

      # 8. 发布 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mk48-linux-aarch64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 手动测试上传
      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mk48-arm64-build
          path: mk48-linux-aarch64.tar.gz
          retention-days: 3
