name: Release ARM64 (Cross-Compile Static)

on:
  push:
    tags:
      - 'v*'  # 仅当推送版本标签（如 v1.0.0）时触发
  workflow_dispatch:  # 允许手动触发

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"  # 关键：启用静态链接

permissions:
  contents: write  # 赋予创建 GitHub Release 的权限

jobs:
  build-and-release:
    name: Build and Release Static ARM64 Binary
    runs-on: ubuntu-latest  # 使用更稳定、快速的 x86-64 Runner
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu]  # 可扩展其他目标，如 armv7

    steps:
      # ---------- 1. 准备环境 ----------
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cross-Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu  # ARM64 链接器

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2022-08-14  # 或你需要的版本
          targets: wasm32-unknown-unknown, ${{ matrix.target }}

      - name: Configure Cargo for Cross-Compile
        run: |
          mkdir -p ~/.cargo
          # 为特定目标配置链接器
          echo -e "[target.${{ matrix.target }}]\nlinker = \"${{ matrix.target }}-gcc\"" >> ~/.cargo/config.toml

      # ---------- 2. 构建缓存（加速后续构建） ----------
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ---------- 3. 构建前端 (WASM) ----------
      - name: Install Trunk (x86-64)
        uses: jetli/trunk-action@v0.1.0  # 在 x86 Runner 上可正常使用
        with:
          version: 'v0.15.0'

      - name: Build Web Client
        working-directory: ./client
        run: trunk build --release

      # ---------- 4. 交叉编译后端服务 ----------
      - name: Build Server for ARM64
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }} \
            --manifest-path server/Cargo.toml \
            --verbose  # 可选，用于调试

      # ---------- 5. 验证并打包 ----------
      - name: Verify Binary Architecture
        run: |
          binary_path="target/${{ matrix.target }}/release/server"
          echo "验证二进制文件: $binary_path"
          file "$binary_path"
          # 检查输出是否包含 'ARM aarch64' 和 'statically linked'

      - name: Prepare Release Package
        run: |
          mkdir -p release_package/public
          # 复制 ARM64 服务端二进制
          cp "target/${{ matrix.target }}/release/server" release_package/mk48-server
          chmod +x release_package/mk48-server
          # 复制前端文件
          cp -r client/dist/* release_package/public/
          # 创建压缩包，文件名包含架构信息
          tar -czf "mk48-${{ matrix.target }}-static.tar.gz" -C release_package .

      # ---------- 6. 创建 GitHub Release ----------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')  # 仅在打标签时发布
        with:
          files: |
            mk48-*-static.tar.gz
          generate_release_notes: true
          prerelease: false

      # ---------- 7. （可选）手动触发时上传产物 ----------
      - name: Upload Build Artifact (Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mk48-arm64-static-build
          path: |
            mk48-*-static.tar.gz
            target/${{ matrix.target }}/release/server
          retention-days: 7
